<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthLens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 200px;
      background: #080810;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 24px;
      height: 24px;
      background: #6366f1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }
    .logo-text {
      font-weight: 600;
      color: #f1f5f9;
      font-size: 14px;
    }
    .site-badge {
      font-size: 11px;
      color: #475569;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 3px 8px;
      border-radius: 20px;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Body */
    .body { padding: 16px; }

    /* Idle state */
    #idle-state { text-align: center; padding: 16px 0; }
    .idle-desc {
      font-size: 12px;
      color: #475569;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .analyze-btn {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .analyze-btn:hover { opacity: 0.9; }
    .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Loading */
    #loading-state { display: none; text-align: center; padding: 28px 0; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; color: #475569; }

    /* Error */
    #error-state {
      display: none;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .error-msg { font-size: 12px; color: #f87171; }
    .retry-btn {
      margin-top: 8px;
      padding: 5px 12px;
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    /* Results */
    #result-state { display: none; }

    .verdict-card {
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .verdict-icon { font-size: 20px; line-height: 1; flex-shrink: 0; }
    .verdict-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }
    .verdict-text {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .verdict-summary {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Score bar */
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .score-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: #334155; }
    .score-num { font-size: 13px; font-weight: 700; }
    .score-track {
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    /* Sources */
    .sources-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #334155;
      margin-bottom: 6px;
    }
    .sources-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .source-chip {
      font-size: 10px;
      padding: 3px 8px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.18);
      border-radius: 20px;
      color: #818cf8;
      text-decoration: none;
      cursor: pointer;
    }
    .source-chip:hover { background: rgba(99,102,241,0.15); }

    /* Open full */
    .open-full-btn {
      width: 100%;
      padding: 9px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #64748b;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      margin-top: 4px;
    }
    .open-full-btn:hover { background: rgba(255,255,255,0.07); color: #94a3b8; }

    .analyze-another {
      font-size: 11px;
      color: #334155;
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 6px;
      display: block;
      width: 100%;
      text-align: center;
      padding: 4px;
    }
    .analyze-another:hover { color: #475569; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">T</div>
      <span class="logo-text">TruthLens</span>
    </div>
    <div class="site-badge" id="site-badge">Loading...</div>
  </div>

  <div class="body">
    <!-- Idle -->
    <div id="idle-state">
      <p class="idle-desc">
        Analyze this page for misinformation, bias, and credibility using live web search.
      </p>
      <button class="analyze-btn" id="analyze-btn">Analyze This Page</button>
    </div>

    <!-- Loading -->
    <div id="loading-state">
      <div class="spinner"></div>
      <p class="loading-text">Searching the web & analyzing...</p>
    </div>

    <!-- Error -->
    <div id="error-state">
      <p class="error-msg" id="error-msg">Something went wrong.</p>
      <button class="retry-btn" id="retry-btn">Try Again</button>
    </div>

    <!-- Result -->
    <div id="result-state">
      <div class="verdict-card" id="verdict-card">
        <div class="verdict-icon" id="verdict-icon"></div>
        <div>
          <div class="verdict-label">Verdict</div>
          <div class="verdict-text" id="verdict-text"></div>
          <div class="verdict-summary" id="verdict-summary"></div>
        </div>
      </div>

      <div class="score-row">
        <span class="score-label">Credibility Score</span>
        <span class="score-num" id="score-num"></span>
      </div>
      <div class="score-track">
        <div class="score-fill" id="score-fill"></div>
      </div>

      <div class="sources-label" id="sources-label" style="display:none">Sources Checked</div>
      <div class="sources-list" id="sources-list"></div>

      <button class="open-full-btn" id="open-full-btn">Open Full Analysis ↗</button>
      <button class="analyze-another" id="analyze-another">← Analyze another page</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
